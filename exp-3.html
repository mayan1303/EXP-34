<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        :root {
            --bg-color: #0b1220;
            --card-color: #141c2f;
            --text-color: #ffffff;
            --button-bg: #ffffff;
            --button-text: #000000;
        }

        body.light {
            --bg-color: #f5f7ff;
            --card-color: #ffffff;
            --text-color: #000000;
            --button-bg: #000000;
            --button-text: #ffffff;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 80px 1fr;
            grid-template-areas:
                "header header"
                "nav main";
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            grid-area: nav;
            background: var(--card-color);
            padding: 25px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
        }

        main {
            grid-area: main;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--card-color);
            padding: 40px;
            border-radius: 20px;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .wide {
            grid-column: span 3;
        }

        button {
            background: var(--button-bg);
            color: var(--button-text);
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <header>
        <div>Admin Dashboard</div>
        <button id="themeBtn" onclick="toggleTheme()">🌞 Light Mode</button>
    </header>

    <nav>
        Navigation
    </nav>

    <main>
        <div class="card">Analytics</div>
        <div class="card">Users</div>
        <div class="card">Settings</div>
        <div class="card wide"></div>
    </main>

</div>

<script>
    const btn = document.getElementById("themeBtn");

    function toggleTheme() {
        document.body.classList.toggle("light");

        if (document.body.classList.contains("light")) {
            localStorage.setItem("theme", "light");
            btn.textContent = "🌙 Dark Mode";
        } else {
            localStorage.setItem("theme", "dark");
            btn.textContent = "🌞 Light Mode";
        }
    }

    // Load saved theme on refresh
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light") {
        document.body.classList.add("light");
        btn.textContent = "🌙 Dark Mode";
    }
</script>

</body>
</html>
